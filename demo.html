<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Demo Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .demo-section {
            margin: 30px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .demo-section h2 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 15px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .output {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            min-height: 60px;
            border: 2px dashed #667eea;
            color: #333;
            word-break: break-word;
        }

        .color-picker {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .color-box {
            width: 50px;
            height: 50px;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s;
            border: 3px solid #ddd;
        }

        .color-box:hover {
            transform: scale(1.1);
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
            color: #999;
            font-size: 14px;
        }

        .counter-display {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            color: #667eea;
            margin: 20px 0;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Interactive Demo</h1>
        <p class="subtitle">Explore interactive features</p>

        <!-- Text Echo Demo -->
        <div class="demo-section">
            <h2>✍️ Text Echo</h2>
            <input type="text" id="textInput" placeholder="Type something here...">
            <button onclick="echoText()">Echo Text</button>
            <div class="output" id="textOutput">Your text will appear here...</div>
        </div>

        <!-- Counter Demo -->
        <div class="demo-section">
            <h2>📊 Counter</h2>
            <div class="counter-display" id="counter">0</div>
            <div class="button-group">
                <button onclick="increment()">➕ Increment</button>
                <button onclick="decrement()">➖ Decrement</button>
                <button onclick="resetCounter()">🔄 Reset</button>
            </div>
        </div>

        <!-- Color Picker Demo -->
        <div class="demo-section">
            <h2>🎨 Color Picker</h2>
            <div class="color-picker">
                <div class="color-box" onclick="changeColor('#667eea')" style="background: #667eea;"></div>
                <div class="color-box" onclick="changeColor('#764ba2')" style="background: #764ba2;"></div>
                <div class="color-box" onclick="changeColor('#f093fb')" style="background: #f093fb;"></div>
                <div class="color-box" onclick="changeColor('#4facfe')" style="background: #4facfe;"></div>
                <div class="color-box" onclick="changeColor('#43e97b')" style="background: #43e97b;"></div>
                <div class="color-box" onclick="changeColor('#fa709a')" style="background: #fa709a;"></div>
            </div>
            <div class="output" id="colorOutput">Pick a color above...</div>
        </div>

        <!-- Random Greeting Demo -->
        <div class="demo-section">
            <h2>👋 Random Greeting</h2>
            <button onclick="generateGreeting()">Generate Greeting</button>
            <div class="output" id="greetingOutput">Click the button to get a greeting...</div>
        </div>

        <div class="footer">
            <p>Made with ❤️ | HTML5 Demo Page</p>
        </div>
    </div>

    <script>
        let count = 0;

        function echoText() {
            const text = document.getElementById('textInput').value;
            const output = document.getElementById('textOutput');
            output.textContent = text || 'Please enter some text...';
        }

        function increment() {
            count++;
            document.getElementById('counter').textContent = count;
        }

        function decrement() {
            count--;
            document.getElementById('counter').textContent = count;
        }

        function resetCounter() {
            count = 0;
            document.getElementById('counter').textContent = count;
        }

        function changeColor(color) {
            document.body.style.background = color;
            document.getElementById('colorOutput').textContent = `Color changed to: ${color}`;
        }

        function generateGreeting() {
            const greetings = [
                '👋 Hello there!',
                '🎉 Welcome to the demo!',
                '✨ You\'re awesome!',
                '🚀 Let\'s get started!',
                '💡 Innovation awaits!',
                '🌟 You\'ve got this!',
                '🎊 Fantastic!',
                '💪 Keep pushing forward!'
            ];
            const randomGreeting = greetings[Math.floor(Math.random() * greetings.length)];
            document.getElementById('greetingOutput').textContent = randomGreeting;
        }

        // Allow Enter key to echo text
        document.getElementById('textInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                echoText();
            }
        });
    </script>
</body>
</html>
